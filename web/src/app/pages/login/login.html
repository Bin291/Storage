<main class="auth">
  <div class="auth-card">
    <div class="brand">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-box-seam-fill" viewBox="0 0 16 16">
  <path fill-rule="evenodd" d="M15.528 2.973a.75.75 0 0 1 .472.696v8.662a.75.75 0 0 1-.472.696l-7.25 2.9a.75.75 0 0 1-.557 0l-7.25-2.9A.75.75 0 0 1 0 12.331V3.669a.75.75 0 0 1 .471-.696L7.443.184l.01-.003.268-.108a.75.75 0 0 1 .558 0l.269.108.01.003zM10.404 2 4.25 4.461 1.846 3.5 1 3.839v.4l6.5 2.6v7.922l.5.2.5-.2V6.84l6.5-2.6v-.4l-.846-.339L8 5.961 5.596 5l6.154-2.461z"/>
</svg>
      <span class="wordmark">Storage</span>
    </div>

    <h1>{{ mode() === 'signin' ? 'Đăng nhập' : 'Tạo tài khoản' }}</h1>
    <p class="sub">Kho lưu trữ cá nhân với AI omnisearch.</p>

    <form (ngSubmit)="submit()">
      <label class="field">
        <span>Email</span>
        <input
          class="input"
          type="email"
          autocomplete="email"
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
          name="email"
          placeholder="ban@example.com"
        />
      </label>

      <label class="field">
        <span>Mật khẩu</span>
        <input
          class="input"
          type="password"
          [autocomplete]="mode() === 'signin' ? 'current-password' : 'new-password'"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
          name="password"
          placeholder="••••••••"
        />
      </label>

      @if (error()) {
        <p class="msg error">{{ error() }}</p>
      }
      @if (notice()) {
        <p class="msg notice">{{ notice() }}</p>
      }

      <button class="btn btn-primary full" type="submit" [disabled]="loading()">
        @if (loading()) {
          <span class="spinner"></span>
        }
        {{ mode() === 'signin' ? 'Đăng nhập' : 'Đăng ký' }}
      </button>
    </form>

    <p class="toggle">
      {{ mode() === 'signin' ? 'Chưa có tài khoản?' : 'Đã có tài khoản?' }}
      <button type="button" class="link" (click)="toggleMode()">
        {{ mode() === 'signin' ? 'Đăng ký' : 'Đăng nhập' }}
      </button>
    </p>
  </div>
</main>
