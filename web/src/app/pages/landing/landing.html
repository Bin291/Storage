<div class="landing">
  <header class="topbar">
    <a class="brand" routerLink="/">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
        <path fill-rule="evenodd" d="M15.528 2.973a.75.75 0 0 1 .472.696v8.662a.75.75 0 0 1-.472.696l-7.25 2.9a.75.75 0 0 1-.557 0l-7.25-2.9A.75.75 0 0 1 0 12.331V3.669a.75.75 0 0 1 .471-.696L7.443.184l.01-.003.268-.108a.75.75 0 0 1 .558 0l.269.108.01.003zM10.404 2 4.25 4.461 1.846 3.5 1 3.839v.4l6.5 2.6v7.922l.5.2.5-.2V6.84l6.5-2.6v-.4l-.846-.339L8 5.961 5.596 5l6.154-2.461z"/>
      </svg>
      <span>Storage</span>
    </a>
    <a routerLink="/login" class="btn btn-secondary btn-sm">Đăng nhập</a>
  </header>

  <app-hero-gallery
    [images]="heroImages"
    variant="default"
    eyebrow="Kho lưu trữ cá nhân"
    title="Mọi tệp của bạn, tìm thấy bằng một câu nói"
    description="Storage kết hợp ổ đĩa đám mây với AI omnisearch: lưu, duyệt, chia sẻ tệp — và tìm lại chúng mà không cần nhớ tên hay vị trí."
    primaryLabel="Bắt đầu miễn phí"
    secondaryLabel="Xem tính năng ↓"
  />

  <section id="features" class="features">
    <div class="features-inner">
      <h2>Vì sao chọn Storage?</h2>
      <div class="feature-grid">
        @for (f of features; track f.title) {
          <div class="feature-card card">
            <span class="mi feature-ico">{{ f.icon }}</span>
            <h3>{{ f.title }}</h3>
            <p>{{ f.desc }}</p>
          </div>
        }
      </div>
    </div>
  </section>

  <app-gradient-footer gradientHeight="36vh">
    <div class="footer-inner">
      <div class="footer-top">
        <div class="footer-brand">
          <span class="wordmark">Storage</span>
          <p>Kho lưu trữ cá nhân với AI omnisearch.</p>
        </div>
        <nav class="footer-links">
          <a routerLink="/login">Đăng nhập</a>
          <a routerLink="/login">Tạo tài khoản</a>
          <a href="#features">Tính năng</a>
        </nav>
      </div>
      <div class="footer-bottom">
        <span>© 2026 Storage</span>
        <span class="status">
          <span class="dot"></span>
          Hệ thống hoạt động bình thường
        </span>
      </div>
    </div>
  </app-gradient-footer>
</div>
