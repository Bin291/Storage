<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Web</title>
  <base href="/">
  <!-- viewport-fit=cover: cho phép nội dung tràn tới mép máy tai thỏ, phần
       tránh vùng khuyết do env(safe-area-inset-*) trong CSS lo (shell.scss).
       KHÔNG đặt user-scalable=no / maximum-scale — người dùng phải zoom được. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Màu thanh trạng thái trình duyệt di động khớp nền trang từng theme. -->
  <meta name="theme-color" content="#fef7ff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141218" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    rel="stylesheet"
  >
</head>
<body>
  <app-root></app-root>
</body>
</html>
